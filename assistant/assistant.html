on process, this word will become something like “張泰言” after the candidate selection. Only if we enable this consolidation, this word will become “章泰炎” which is the expected result that the context is kept as-is."},"ja":{"shortTitle":"候補陳列ウィンドウで候補を選ぶ時に文脈を強固する","description":"例えば、入力緩衝列には「章太炎」という節点があり、その範囲は [0,3) である。もし、「太」を「泰」にしたいのなら、今回の作業範囲は [1,2) で、「章太炎」の範囲と重ねてしまう。この場合、もし、事前強固措置がなければ、今回の作業でこの単語は「張泰言」のような望ましくない変換結果になってしまう。事前強固措置があるからこそ、「章泰炎」のような正確な作業結果の保証である。"},"zh-Hans":{"shortTitle":"在使用选字窗选字时，自动巩固上下文","description":"打比方说，你敲了「章太炎」，你想将「太」改成「泰」。这个操作的作业索引范围是开闭区间 [1,2)，会切到「章太炎」这个节点的所在索引范围 [0,3)。如果没有事前巩固处理的话，这个词会在你选字之后变成诸如「张泰言」这种你不想要的自动选字结果。当且仅当你启用了这个巩固功能的前提下，你选字之后的结果才会是「章泰炎」这种你想要的结果。"},"zh-Hant":{"shortTitle":"在使用選字窗選字時，自動鞏固上下文","description":"打比方說，你敲了「章太炎」，你想將「太」改成「泰」。這個操作的作業索引範圍是開閉區間 [1,2)，會切到「章太炎」這個節點的所在索引範圍 [0,3)。如果沒有事前鞏固處理的話，這個詞會在你選字之後變成諸如「張泰言」這種你不想要的自動選字結果。當且僅當你啟用了這個鞏固功能的前提下，你選字之後的結果才會是「章泰炎」這種你想要的結果。"}}},{"key":"kPreferredRevolverForceLevel","rawValue":"PreferredRevolverForceLevel","type":"integer","defaultsType":"integer","default":2,"range":[0,2],"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":[{"i18nKey":"i18n:UserDef.kPreferredRevolverForceLevel.option.0","labels":{"en":"Always use Strong Revolve (Prioritize Result)","ja":"常に強きお回しを使用 (候補優先)","zh-Hans":"一律使用强轮替 (优先候选结果)","zh-Hant":"一律使用強輪替 (優先候選結果)"},"value":0},{"i18nKey":"i18n:UserDef.kPreferredRevolverForceLevel.option.1","labels":{"en":"Use Weak-Revolve only for (Shift+)Space","ja":"(Shift+)Space時のみ軽きお回しを使用","zh-Hans":"仅在 (Shift+)Space 轮替时启用弱轮替","zh-Hant":"僅在 (Shift+)Space 輪替時啟用弱輪替"},"value":1},{"i18nKey":"i18n:UserDef.kPreferredRevolverForceLevel.option.2","labels":{"en":"Always use Weak-Revolve (Prioritize Protection)","ja":"常に軽きお回しを使用 (保護優先)","zh-Hans":"一律使用弱轮替 (优先保护已选内容)","zh-Hant":"一律使用弱輪替 (優先保護已選內容)"},"value":2}],"optionsKind":"labels","labels":{"en":{"shortTitle":"In-place Revolve Strength","description":"Introduced in v4.5.4, \"Weak-Revolve\" is a protection mechanism for in-place revolving via keyboard shortcuts (e.g., Space/Tab). If a multi-syllable candidate would overwrite manually selected characters outside the current cursor position, it is skipped to prevent previous selections from being unexpectedly affected. This is especially useful for users who prefer \"character-by-character\" selection, ensuring that prior overrides remain intact while revolving subsequent text. This does not affect selections made via the candidate window."},"ja":{"shortTitle":"候補お回しの強度設定","description":"v4.5.4より「軽きお回し」保護機能を導入しました。キーボードショートカット（Space/Tab等）でその場での候補切り替え（お回し）を行う際、複数音節の候補が現在のカーソル位置以外で「既に手動選択された文字」を上書きしてしまう場合は、その候補をスキップし、選択内容が不意に書き換えられたり影響を受けたりするのを防ぎます。これにより、一文字ずつ丁寧に選字する方が、後方の文字を切り替えても前方の選択内容が維持されます。この機能は候補窓による選択には影響しません。"},"zh-Hans":{"shortTitle":"就地轮替强度偏好","description":"自 v4.5.4 版起引入「弱轮替」保护机制：当您使用键盘热键（如 Space/Tab）进行就地轮替时，若目标为多音节候选、且其范围会覆盖到「非当前游标位置」且「已被您手动选定」的字词时，系统将跳过该候选，以防止已选定的内容受到意外影响。此功能特别适合习惯「一个字一个字地选字」的使用者，能确保您在修正后方字词时，前方已选定的内容依然稳固。此设定不影响选字窗的选字行为。"},"zh-Hant":{"shortTitle":"就地輪替強度偏好","description":"自 v4.5.4 版起引入「弱輪替」保護機制：當您使用鍵盤熱鍵（如 Space/Tab）進行就地輪替時，若目標為多音節候選、且其範圍會覆蓋到「非當前游標位置」且「已被您手動選定」的字詞時，系統將跳過該候選，以防止已選定的內容受到意外影響。此功能特別適合習慣「一個字一個字地選字」的使用者，能確保您在修正後方字詞時，前方已選定的內容依然穩固。此設定不影響選字窗的選字行為。"}}},{"key":"kHardenVerticalPunctuations","rawValue":"HardenVerticalPunctuations","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Harden vertical punctuations during vertical typing (not recommended)","description":"⚠︎ This feature is useful ONLY WHEN the font you are using doesn't support dynamic vertical punctuations. However, typed vertical punctuations will always shown as vertical punctuations EVEN IF your editor has changed the typing direction to horizontal."},"ja":{"shortTitle":"縦書きの時に、引用符・括弧などを強制的に縦書き文字と変換する（不推奨）","description":"⚠︎ 該当の組版用フォントには縦書き（引用符・括弧）変換機能が備えていない限り、この機能を使う甲斐がある。一旦使うと、入力した全ての引用符・括弧は永遠的に縦書きの様式になる。例え入力を受けているアプリ（例えばワープロソフとなど）の書写方向は横書きと変えたとしても、これらの入力済みの引用符・括弧は全て縦書きの見た目であり、削除してから入力し直す必要になる。"},"zh-Hans":{"shortTitle":"在纵排书写时，强制转换标点为纵排形式（不推荐）","description":"⚠︎ 该功能当且仅当目前的排版字型不支援纵排标点动态显示转义的情况下才有用。一旦使用了，所有敲出去的标点都会被永久转换为静态纵排标点：哪怕当前编辑器的排版模式已经改成横排，这些已经输入的标点也都还是纵排标点字元。"},"zh-Hant":{"shortTitle":"在縱排書寫時，強制轉換標點為縱排形式（不推薦）","description":"⚠︎ 該功能當且僅當目前的排版字型不支援縱排標點動態顯示轉義的情況下才有用。一旦使用了，所有敲出去的標點都會被永久轉換為靜態縱排標點：哪怕當前編輯器的排版模式已經改成橫排，這些已經輸入的標點也都還是縱排標點字元。"}}},{"key":"kTrimUnfinishedReadingsOnCommit","rawValue":"TrimUnfinishedReadingsOnCommit","type":"bool","defaultsType":"bool","default":true,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Trim unfinished readings / strokes on commit"},"ja":{"shortTitle":"送り出す緩衝列内容から未完成な音読み/筆組みを除く"},"zh-Hans":{"shortTitle":"在递交时清理未完成拼写的读音或字根"},"zh-Hant":{"shortTitle":"在遞交時清理未完成拼寫的讀音或字根"}}},{"key":"kAlwaysShowTooltipTextsHorizontally","rawValue":"AlwaysShowTooltipTextsHorizontally","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Always show tooltip texts horizontally","description":"Key names in tooltip will be shown as symbols when the tooltip is vertical. However, this option will be ignored since tooltip will always be horizontal if the UI language is English."},"ja":{"shortTitle":"ヒントを常に横書きにする","description":"縦書き入力の場合、ヒントにはキーの名前は常に符号で表示する。"},"zh-Hans":{"shortTitle":"始终使用横排来显示工具提示视窗","description":"纵排输入的情况下，工具提示内的按键名称会以符号显示。"},"zh-Hant":{"shortTitle":"始終使用橫排來顯示工具提示視窗","description":"縱排輸入的情況下，工具提示內的按鍵名稱會以符號顯示。"}}},{"key":"kClientsIMKTextInputIncapable","rawValue":"ClientsIMKTextInputIncapable","type":"dictionary","defaultsType":"dict","default":{"com.openai.chat":tru andidate window"},"ja":{"shortTitle":"候補陳列ウィンドウで Unicode のコードポイント情報を示す"},"zh-Hans":{"shortTitle":"在选字窗内显示当前候选字的万国码码位"},"zh-Hant":{"shortTitle":"在選字窗內顯示當前候選字的萬國碼碼位"}}},{"key":"kAutoCompositeWithLongestPossibleCassetteKey","rawValue":"AutoCompositeWithLongestPossibleCassetteKey","type":"bool","defaultsType":"bool","default":true,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Auto-composite when the longest possible key is formed"},"ja":{"shortTitle":"最長可能キーができた場合、文字を組み立つ"},"zh-Hans":{"shortTitle":"在已经敲出最长可能码的时候自动组字"},"zh-Hant":{"shortTitle":"在已經敲出最長可能碼的時候自動組字"}}},{"key":"kShareAlphanumericalModeStatusAcrossClients","rawValue":"ShareAlphanumericalModeStatusAcrossClients","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Share alphanumerical mode status across all clients","description":"This only works when being toggled by Shift key and JIS Eisu key."},"ja":{"shortTitle":"全ての客体アプリに英数入力モードの状態を共有","description":"Shift キーとJIS 英数キーだけでの英数入力モード状態切替の話。"},"zh-Hans":{"shortTitle":"对所有客体应用共用中英文输入切换状态","description":"仅用于以 Shift 键或 JIS 英数键切换中英文输入模式的场合。"},"zh-Hant":{"shortTitle":"對所有客體應用共用中英文輸入切換狀態","description":"僅用於以 Shift 鍵或 JIS 英數鍵切換中英文輸入模式的場合。"}}},{"key":"kPhraseEditorAutoReloadExternalModifications","rawValue":"PhraseEditorAutoReloadExternalModifications","type":"bool","defaultsType":"bool","default":true,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"This editor only: Auto-reload modifications happened outside of this editor"},"ja":{"shortTitle":"このエディターの外部からの編集結果をこのエディターに自動的に読み込む"},"zh-Hans":{"shortTitle":"仅限该编辑器：自动读入来自该编辑器外部的档案内容修改"},"zh-Han  the ETen Chinese DOS input method and wish to use the same order here. Note: the select-candidate-per-character mode always follows this ordering and is not affected by this setting."},"ja":{"shortTitle":"単漢字候補の陳列順番を倚天中国語DOS順に強制する","description":"このスイッチは、倚天中国語DOSの候補順に慣れたユーザー向けに用意されております。候補の陳列順番を手動で管理したいという需要の多くがこの並びに起因するためです。なお、全候補選択入力モードでは常にこの並び順が適用され、このスイッチの影響は受けません。"},"zh-Hans":{"shortTitle":"对所有单汉字候选字强制施加倚天中文DOS系统排序","description":"对敝输入法的候选字的顺序有着强烈的手动调整之需求的使用者们往往都是从倚天中文 DOS 开始积累了对候选字的直觉记忆、希望能使用这种候选字排序，故提供该选项。逐字选字模式会始终遵循该排序特性，不受该开关所影响。"},"zh-Hant":{"shortTitle":"對所有單漢字候選字強制施加倚天中文DOS系統排序","description":"對敝輸入法的候選字的順序有著強烈的手動調整之需求的使用者們往往都是從倚天中文 DOS 開始積累了對候選字的直覺記憶、希望能使用這種候選字排序，故提供該選項。逐字選字模式會始終遵循該排序特性，不受該開關所影響。"}}},{"key":"kRomanNumeralOutputFormat","rawValue":"RomanNumeralOutputFormat","type":"integer","defaultsType":"integer","default":0,"range":[0,3],"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":[{"i18nKey":"i18n:UserDef.kRomanNumeralOutputFormat.option.0","labels":{"en":"ASCII Uppercase","ja":"ASCII大文字","zh-Hans":"ASCII 大写","zh-Hant":"ASCII 大寫"},"value":0},{"i18nKey":"i18n:UserDef.kRomanNumeralOutputFormat.option.1","labels":{"en":"ASCII Lowercase","ja":"ASCII小文字","zh-Hans":"ASCII 小写","zh-Hant":"ASCII 小寫"},"value":1},{"i18nKey":"i18n:UserDef.kRomanNumeralOutputFormat.option.2","labels":{"en":"Unicode Roman Numerals (Uppercase)","ja":"Unicodeローマ数字 大文字","zh-Hans":"万国码罗马数字(大写)","zh-Hant":"萬國碼羅馬數字(大寫)"},"value":2},{"i18nKey":"i18n:UserDef.kRomanNumeralOutputFormat.option.3","labels":{"en":"Unicode Roman Numerals (Lowercase)","ja":"Unicodeローマ数字 小文字","zh-Hans":"万国码罗马数字(小写)","zh-Hant":"萬國碼羅馬數字(小寫)"},"value":3}],"optionsKind":"labels","labels":{"en":{"shortTitle":"Roman Numeral Output Format","description":"Roman Numeral Input Mode can be switched to while using [Opt]+[Symbol Menu Key] to revolve the current typing method, supporting integers in the closed range of [1, 3999]. After a successful or failed input, this mode will be automatically switched off."},"ja":{"shortTitle":"ローマ数字出力形式","description":"ローマ数字打込モードは [Opt]+[符号メニューキー] を使用中に打込方式を切り替えるときに有効にすることができ、[1, 3999] の閉区間内の整数をサポートしています。出力が成功したか失敗したかにかかわらず、このモードは自動的にオフになります。"},"zh-Hans":{"shortTitle":"罗马数字输出格式","description":"罗马数字输入模式可以在敲 [Opt]+[符号选单键] 切换输入方式时启用，支援 [1, 3999] 闭区间内的整数。输入成功或失败后，该模式会自动关闭。"},"zh-Hant":{"shortTitle":"羅馬數字輸出格式","description":"羅馬數字輸入模式可以在敲 [Opt]+[符號選單鍵] 切換輸入方式時啟用，支援 [1, 3999] 閉區間內的整數。輸入成功或失敗後，該模式會自動關閉。"}}},{"key":"kReducePOMLifetimeToNoMoreThan12Hours","rawValue":"ReducePOMLifetimeToNoMoreThan12Hours","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Enable rapid forgetting mode","description":"When enabled, the perception override model's forgetting cycle will be reduced from approximately one week to within 12 hours, clearing infrequently used memory records more quickly."},"ja":{"shortTitle":"急速忘却モードを有効にする","description":"有効にすると、臨時記憶モジュールの忘却サイクルが約1週間から12時間以内に短縮され、使用頻度の低いメモリレコードがより迅速にクリアされます。"},"zh-Hans":{"shortTitle":"启用急速遗忘模式","description":"启用后，渐退记忆模组的遗忘周期将从约一周降低至 12 小时内，更快地清除不常用的记忆记录。"},"zh-Hant":{"shortTitle":"啟用急速遺忘模式","description":"啟用後，漸退記憶模組的遺忘週期將從約一週降低至 12 小時內，更快地清除不常用的記憶記錄。"}}},{"key":"kUseSpaceToCommitHighlightedCandidate4SCPC","rawValue":"UseSpaceToCommitHighlightedCandidate4SCPC","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Use Space to confirm highlighted candidate in Per-Char Select Mode","description":"If enabled, pressing Space while candidate window is visible will confirm the highlighted candidate instead. This setting is only effective in the Per-Char Select Mode (SCPC)."},"ja":{"shortTitle":"全候補入力の場合、ハイライト候補を Space キーで確認","description":"有効にすると、候補ウィンドウ表示中にスペースキーを押すとハイライトされた候補を確定します。この設定は全候補入力モード（SCPC）でのみ有効です。"},"zh-Hans":{"shortTitle":"在逐字选字模式当中使用空格键确认当前高亮候选字","description":"启用后，在选字窗可见时按空格键将确认高亮候选字。仅逐字选字模式（SCPC）下生效。"},"zh-Hant":{"shortTitle":"在逐字選字模式當中使用空格鍵確認當前高亮候選字","description":"啟用後，在選字窗可見時按空格鍵將確認高亮候選字。僅逐字選字模式（SCPC）下生效。"}}},{"key":"kEnableCandidateWindowAnimation","rawValue":"EnableCandidateWindowAnimation","type":"bool","defaultsType":"bool","default":true,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Enable animation for candidate window movement/resize"},"ja":{"shortTitle":"候補ウィンドウの移動/サイズ変更にアニメーションを適用"},"zh-Hans":{"shortTitle":"选字窗移动/变更大小时启用动画效果"},"zh-Hant":{"shortTitle":"選字窗移動/變更大小時啟用動畫效果"}}},{"key":"kDisableSegmentedThickUnderlineInMarkingModeForManagedClients","rawValue":"DisableSegmentedThickUnderlineInMarkingModeForManagedClients","type":"bool","defaultsType":"bool","default":false,"range":null,"minimumOS":10.9,"exchangeBlacklisted":false,"metadataPending":false,"metadataPendingReason":"none","options":null,"optionsKind":null,"labels":{"en":{"shortTitle":"Disable segmented thick underline in marking mode for managed clients","description":"Some clients with web-based front UI may have issues rendering segmented thick underlines drawn by their implemented “setMarkedText()”. This option stops the input method from delivering segmented thick underlines to “client().setMarkedText()”. Note that segmented thick underlines are only used in marking mode, unless the client itself misimplements the IMKTextInput method “setMarkedText()”. This option only affects the inline composition buffer."},"ja":{"shortTitle":"管理されている客体アプリには、マーキングモードの多段式太下線の描きを禁ず","description":"一部の「Web UI を用いた」客体アプリには、多段式太下線の描きをうまく取り扱えぬ支障はございます。このチェックを入れると、IME から「client().setMarkedText()」を経由して、客体に「多段式太下線を書かずに」と命令することはできます。多段式太下線はマーキングモードだけで用いるデザインですが、間違くて別のモードでもそれを書いてしまう客体アプ             var keys = keysOfScope(starter, scope);
            for (var i = 0; i < keys.length; i += 1)
                table[keys[i]] = true;
        }
        if (scope === "named") {
            state.starterNamedOff = table;
        }
        else {
            state.starterResetOff = table;
        }
        syncStarter();
        render();
    }
    function applyStarter(on) {
        state.starterOn = on;
        syncStarter();
    }
    function syncStarter() {
        var previous = Object.keys(state.starterAdded);
        for (var i = 0; i < previous.length; i += 1) {
            if (state.manual[previous[i]])
                continue;
            delete state.answers[previous[i]];
        }
        state.starterAdded = {};
        if (!state.starterOn)
            return;
        var starter = VCA.starterFor(state.profile, osVersion);
        var written = VCA.starterWrittenKeys(starter, state.starterNamedOff, state.starterResetOff);
        for (var j = 0; j < written.length; j += 1) {
            var raw = written[j];
            if (state.manual[raw])
                continue;
            state.answers[raw] = starter.values[raw];
            state.starterAdded[raw] = true;
        }
    }
    function questionIndexByRawValue() {
        var table = {};
        var questions = VCA.allQuestionsFor({ origin: "newbie", typing: "unsure" }, osVersion);
        for (var q = 0; q < questions.length; q += 1) {
            var entry = questions[q].entry;
            if (entry)
                table[entry.rawValue] = questions[q];
        }
        return table;
    }
    function preferenceTable(rows) {
        var questionIndex = questionIndexByRawValue();
        var table = VCA.el("table", "vca-table", null);
        var header = VCA.el("tr", null, null);
        header.appendChild(VCA.el("th", null, VCA.t("summary.tableKey")));
        header.appendChild(VCA.el("th", null, VCA.t("summary.tableValue")));
        table.appendChild(header);
        for (var i = 0; i < rows.length; i += 1) {
            var entry = VCA.entryByRawValue(rows[i].key);
            if (!entry)
                continue;
            var row = VCA.el("tr", null, null);
            row.appendChild(VCA.el("td", null, displayTitleOf(entry)));
            var question = questionIndex[rows[i].key];
            var valueText = question
                ? VCA.labelForValue(question, rows[i].value, state.lang)
                : VCA.formatValue(entry, rows[i].value, state.lang);
            row.appendChild(VCA.el("td", "vca-td-value", valueText));
            table.appendChild(row);
        }
        return table;
    }
    function renderSummary(container) {
        var preset = currentPreset();
        container.appendChild(VCA.el("div", "vca-h1", VCA.t("summary.h1")));
        container.appendChild(VCA.el("div", "vca-lead", VCA.t("summary.lead")));
        container.appendChild(metaField("meta-title", VCA.t("summary.metaTitle"), state.metaTitle, defaultTitle(), function (value) { state.metaTitle = value; }));
        container.appendChild(metaField("meta-description", VCA.t("summary.metaDescription"), state.metaDescription, VCA.t("summary.defaultDescription"), function (value) { state.metaDescription = value; }));
        if (preset.accepted.length === 0) {
            container.appendChild(VCA.el("div", "vca-warn", VCA.t("summary.empty")));
        }
        else {
            container.appendChild(VCA.el("div", "vca-p", VCA.tf("summary.count", [preset.accepted.length])));
            if (state.starterOn) {
                var starterPreset = VCA.starterFor(state.profile, osVersion);
                var excludedNamed = excludedCountOfScope(starterPreset, "named");
                if (excludedNamed > 0) {
                    container.appendChild(VCA.el("div", "vca-hint", VCA.tf("summary.starterNamedExcluded", [excludedNamed])));
                }
                var excludedReset = excludedCountOfScope(starterPreset, "reset");
                var scopeText = VCA.t("summary.starterScope");
                if (excludedReset > 0) {
                    scopeText = excludedReset >= starterPreset.resetKeys.length
                        ? VCA.t("summary.starterScopeOff")
                        : VCA.tf("summary.starterScopePartial", [excludedReset]);
                }
                container.appendChild(VCA.el("div", "vca-hint", scopeText));
            }
            var rows = [];
            for (var i = 0; i < preset.accepted.length; i += 1) {
                rows.push({ key: preset.accepted[i].entry.rawValue, value: preset.accepted[i].value });
            }
            container.appendChild(preferenceTable(rows));
        }
        if (preset.rejected.length > 0) {
            var rejectedText = "";
            for (var r = 0; r < preset.rejected.length; r += 1) {
                rejectedText += "⚠ " + preset.rejected[r].key + ": " + preset.rejected[r].reason + "\n";
            }
            container.appendChild(VCA.el("pre", "vca-warn", rejectedText));
        }
        container.appendChild(VCA.el("hr", "vca-rule", null));
        var buttons = VCA.el("div", null, null);
        var status = VCA.el("div", "vca-hint", "");
        var copyBtn = VCA.el("button", "vca-btn", VCA.t("summary.copy"));
        copyBtn.type = "button";
        copyBtn.onclick = function () {
            VCA.copyText(preset.json, function (ok) {
                status.textContent = ok ? VCA.t("summary.copied") : VCA.t("summary.copyFailed");
                if (!ok) {
                    state.jsonVisible = true;
                    render();
                }
            });
            return false;
        };
        var downloadBtn = VCA.el("button", "vca-btn", VCA.t("summary.download"));
        downloadBtn.type = "button";
        downloadBtn.onclick = function () {
            var ok = VCA.downloadText(PRESET_FILENAME, preset.json);
            status.textContent = ok ? VCA.t("summary.downloadHint") : VCA.t("summary.copyManual");
            if (!ok) {
                state.jsonVisible = true;
                render();
            }
            return false;
        };
        buttons.appendChild(copyBtn);
        buttons.appendChild(downloadBtn);
        container.appendChild(buttons);
        container.appendChild(status);
        container.appendChild(VCA.el("hr", "vca-rule", null));
        container.appendChild(VCA.el("div", "vca-h2", VCA.t("summary.next")));
        var list = VCA.el("ol", "vca-steps", null);
        list.appendChild(VCA.el("li", null, VCA.t("summary.next1")));
        list.appendChild(VCA.el("li", null, VCA.t("summary.next2")));
        list.appendChild(VCA.el("li", null, VCA.t("summary.next3")));
        container.appendChild(list);
        var jsonToggle = VCA.el("a", "vca-link", state.jsonVisible ? VCA.t("summary.hideJson") : VCA.t("summary.showJson"));
        jsonToggle.href = "#";
        jsonToggle.onclick = function () {
            state.jsonVisible = !state.jsonVisible;
            render();
            return false;
        };
        container.appendChild(jsonToggle);
        if (state.jsonVisible) {
            var area = document.createElement("textarea");
            area.className = "vca-textarea";
            area.setAttribute("data-focus-key", "summary-json");
            area.value = preset.json;
            area.readOnly = true;
            container.appendChild(area);
            container.appendChild(VCA.el("div", "vca-hint", VCA.t("summary.copyManual")));
        }
        container.appendChild(VCA.el("hr", "vca-rule", null));
        container.appendChild(VCA.el("div", "vca-hint", VCA.t("summary.defaultsNote")));
        container.appendChild(VCA.el("div", "vca-hint", VCA.t("summary.disclaimer")));
    }
    function metaField(focusKey, label, value, placeholder, onChange) {
        var host = VCA.el("div", "vca-q", null);
        host.appendChild(VCA.el("div", "vca-q-title", label));
        var input = document.createElement("input");
        input.type = "text";
        input.className = "vca-input";
        input.value = value;
        input.setAttribute("placeholder", placeholder);
        input.setAttribute("data-focus-key", focusKey);
        input.onchange = function () { onChange(input.value); };
        input.onblur = function () { onChange(input.value); };
        host.appendChild(input);
        return host;
    }
    function setAnswer(question, value) {
        if (!question.entry) {
            if (question.id === "origin") {
                state.profile.origin = String(value);
                syncStarter();
            }
            if (question.id === "typing") {
                state.profile.typing = String(value);
                pruneHiddenAnswers();
                syncStarter();
            }
            if (question.id === "starter")
                applyStarter(value === "on");
            return;
        }
        state.answers[question.entry.rawValue] = value;
        state.manual[question.entry.rawValue] = true;
    }
    function clearAnswer(question) {
        if (!question.entry) {
            if (question.id === "origin") {
                state.profile.origin = "";
                syncStarter();
            }
            if (question.id === "typing") {
                state.profile.typing = "";
                pruneHiddenAnswers();
                syncStarter();
            }
            if (question.id === "starter")
                applyStarter(false);
            return;
        }
        delete state.answers[question.entry.rawValue];
        delete state.manual[question.entry.rawValue];
        delete state.starterAdded[question.entry.rawValue];
    }
    function pruneHiddenAnswers() {
        var steps = currentSteps();
        var visible = {};
        for (var s = 0; s < steps.length; s += 1) {
            for (var q = 0; q < steps[s].questions.length; q += 1) {
                var entry = steps[s].questions[q].entry;
                if (entry)
                    visible[entry.rawValue] = true;
            }
        }
        var raws = Object.keys(state.answers);
        for (var i = 0; i < raws.length; i += 1) {
            if (visible[raws[i]])
                continue;
            delete state.answers[raws[i]];
            delete state.manual[raws[i]];
            delete state.starterAdded[raws[i]];
        }
    }
    function toggleFillRecommended(step, checked) {
        state.fillRecommended[step.id] = checked;
        var added = state.fillAdded[step.id] || [];
        if (checked) {
            var additions = VCA.fillSuggestions(step, state);
            var raws = Object.keys(additions);
            for (var i = 0; i < raws.length; i += 1) {
                state.answers[raws[i]] = additions[raws[i]];
                if (added.indexOf(raws[i]) < 0)
                    added.push(raws[i]);
            }
        }
        else {
            for (var j = 0; j < added.length; j += 1) {
                if (state.manual[added[j]])
                    continue;
                delete state.answers[added[j]];
            }
            added = [];
        }
        state.fillAdded[step.id] = added;
        render();
    }
    function effectiveTitle() {
        var typed = state.metaTitle.replace(/^\s+|\s+$/g, "");
        return typed ? typed : defaultTitle();
    }
    function defaultTitle() {
        if (!state.starterOn || state.profile.origin === "")
            return VCA.t("summary.defaultTitle");
        return VCA.tf("summary.starterTitle", [originDisplayName()]);
    }
    function originDisplayName() {
        if (!state.profile.origin)
            return VCA.t("summary.defaultTitle");
        var shortKey = VCA.ORIGIN_SHORT_NAME_KEY[state.profile.origin];
        if (shortKey)
            return VCA.t(shortKey);
        return VCA.t("origin.opt." + state.profile.origin);
    }
    function effectiveDescription() {
        return state.metaDescription.replace(/^\s+|\s+$/g, "") || VCA.t("summary.defaultDescription");
    }
    function currentPreset() {
        return VCA.buildPreset({
            answers: state.answers,
            title: effectiveTitle(),
            description: effectiveDescription(),
        });
    }
    function handleNav(action) {
        var steps = currentSteps();
        if (action === "cancel") {
            VCA.showConfirm(VCA.t("nav.confirmTitle"), VCA.t("nav.confirmMessage"), VCA.t("nav.confirmYes"), VCA.t("nav.confirmNo"), function () {
                state = createInitialState(state.lang);
                render();
            }, function () { });
            return;
        }
        if (action === "back") {
            if (state.stepIndex > 0) {
                var fromSkip = state.skipFromIndex >= 0 && state.stepIndex === steps.length - 1;
                state.stepIndex = fromSkip ? state.skipFromIndex : state.stepIndex - 1;
                state.skipFromIndex = -1;
                render();
            }
            return;
        }
        if (action === "summary") {
            state.skipFromIndex = state.stepIndex;
            state.stepIndex = steps.length - 1;
            render();
            return;
        }
        if (action === "next") {
            state.skipFromIndex = -1;
            if (state.stepIndex < steps.length - 1) {
                state.stepIndex += 1;
                render();
                return;
            }
            showFinishDialog();
        }
    }
    function showFinishDialog() {
        VCA.showInfo(VCA.t("summary.h1"), [
            VCA.t("summary.next1"), VCA.t("summary.next2"), VCA.t("summary.next3"),
        ].join("\n"), "OK");
    }
    function handleLang(lang) {
        VCA.setLang(lang);
        state.lang = VCA.currentLang;
        document.documentElement.setAttribute("lang", state.lang);
        render();
    }
    function handleKey(event) {
        if (VCA.modalOpen)
            return;
        var target = event.target;
        var tag = target && target.tagName ? String(target.tagName).toLowerCase() : "";
        if (tag === "textarea" || tag === "select")
            return;
        if (event.altKey && event.keyCode === 37) {
            handleNav("back");
            return;
        }
        if (event.keyCode !== 13)
            return;
        if (tag === "button" || tag === "a")
            return;
        if (tag === "input") {
            var inputType = String(target.type).toLowerCase();
            if (inputType === "radio" || inputType === "checkbox")
                return;
            if (typeof target.blur === "function")
                target.blur();
        }
        handleNav("next");
    }
    function updateUrlState() {
        try {
            var historyAny = window.history;
            if (!historyAny || typeof historyAny.replaceState !== "function")
                return;
            var query = "?lang=" + encodeURIComponent(state.lang) +
                "&express=" + (state.expressOnly ? "1" : "0") +
                "&step=" + (state.stepIndex + 1);
            historyAny.replaceState(null, document.title, window.location.pathname + query);
        }
        catch (error) {
        }
    }
    function parseQuery(search) {
        var result = {};
        if (!search)
            return result;
        var body = search.charAt(0) === "?" ? search.slice(1) : search;
        var pairs = body.split("&");
        for (var i = 0; i < pairs.length; i += 1) {
            if (!pairs[i])
                continue;
            var separator = pairs[i].indexOf("=");
            var key = separator < 0 ? pairs[i] : pairs[i].slice(0, separator);
            var value = separator < 0 ? "" : pairs[i].slice(separator + 1);
            result[decodeURIComponent(key)] = decodeURIComponent(value.replace(/\+/g, " "));
        }
        return result;
    }
})(VCA || (VCA = {}));

</script>
<script>
VCA.boot();
</script>
